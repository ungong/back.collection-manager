spring:
  application:
    name: back.collection-manager
  datasource:
    url: jdbc:h2:mem:comicsdb;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:db/collection_manager_v4_plugin_first.sql'
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-comics

  jpa:
    hibernate:
      ddl-auto: none

    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG